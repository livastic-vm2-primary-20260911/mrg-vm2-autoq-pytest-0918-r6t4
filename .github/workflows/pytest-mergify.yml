name: VM2 Pytest Mergify AutoQ

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest-mergify
        run: python -m pip install --disable-pip-version-check pytest pytest-mergify==2026.9.11.2
      - name: Run pytest with Mergify Test Insights
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
        run: pytest -q -ra tests/test_autoq_fresh_nomanual_0918.py

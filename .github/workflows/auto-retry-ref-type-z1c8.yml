name: VM2 Auto Retry Ref Type Z1C8
on:
  push:
    branches:
      - 'vm2-autoretry-ref-z1c8'
    tags:
      - 'vm2-autoretry-ref-z1c8'
permissions:
  contents: read
jobs:
  retry-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Show ref identity
        run: echo "ref_name=$GITHUB_REF_NAME ref_type=$GITHUB_REF_TYPE ref=$GITHUB_REF sha=$GITHUB_SHA"
      - name: Controlled failure
        run: |
          echo VM2_AUTORETRY_REF_TYPE_Z1C8_FAIL
          exit 1

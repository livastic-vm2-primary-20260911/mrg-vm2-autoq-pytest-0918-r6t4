name: VM2 RepoID Binding Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binding-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest-mergify
        run: python -m pip install --disable-pip-version-check pytest pytest-mergify
      - name: Matched path-A payload-id-A control
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
        run: |
          echo "matched_repo=$GITHUB_REPOSITORY matched_id=$GITHUB_REPOSITORY_ID"
          python -m pytest -q -s tests/test_repoid_matched.py
      - name: Mismatch path-A payload-id-B probe
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
        run: |
          env GITHUB_REPOSITORY_ID=1375171739 bash -c 'echo "child_repo=$GITHUB_REPOSITORY child_repo_id=$GITHUB_REPOSITORY_ID"; python -m pytest -q -s tests/test_repoid_binding.py'

name: VM2 Test Selection Rollout Recheck 0922
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read current test-selection gate
        env:
          TOKEN: ${{ secrets.MERGIFY_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, urllib.parse, urllib.request, urllib.error
          owner="vm2-billing-checkout-v7m3-260916"
          repo="mrg-vm2-autoq-pytest-0918-r6t4"
          q=urllib.parse.urlencode({
            "branch":"vm2-selection-gate-probe-0922",
            "head_sha":"0"*40,
            "pipeline_name":"VM2 Test Selection Rollout Recheck 0922",
            "job_name":"probe",
            "collection_fingerprint":"0"*64,
          })
          url=f"https://api.mergify.com/v1/ci/{owner}/repositories/{repo}/test-selection?{q}"
          req=urllib.request.Request(url,headers={
            "Authorization":"Bearer "+os.environ["TOKEN"],
            "Accept":"application/json",
            "User-Agent":"vm2-selection-gate-recheck-0922",
          })
          try:
              with urllib.request.urlopen(req,timeout=20) as r:
                  status=r.status; body=r.read().decode()
          except urllib.error.HTTPError as e:
              status=e.code; body=e.read().decode()
          print("status="+str(status))
          print("body="+body[:1000])
          PY

name: VM2 AutoQ Fresh No-Manual 0918

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  pytest-fresh-autoq:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install current pytest-mergify
        run: python -m pip install --disable-pip-version-check pytest pytest-mergify
      - name: Run only fresh no-manual-history AutoQ test
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
        run: pytest -q -ra tests/test_autoq_fresh_nomanual_0918.py
